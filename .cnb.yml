$:
  vscode:
    - runner:
        cpus: 16
      docker:
        image: docker.cnb.cool/learningos/oscamp-2026s/rustlings
      services:
        - vscode
        - docker
  push:
    - docker:
        image: docker.cnb.cool/learningos/oscamp-2026s/rcore-tutorial-2026s
      imports: https://cnb.cool/LearningOS/OSCamp-2026S/keys/-/blob/main/rcore-secrets.yml
      stages:
        - name: Run grading tests
          script: |
            qemu-system-riscv64 --version
            rustup target add riscv64gc-unknown-none-elf
            rm -rf ci-user
            git clone https://github.com/LearningOS/rCore-Tutorial-Checker.git ci-user
            git clone https://github.com/LearningOS/rCore-Tutorial-Test.git ci-user/user
            ID=$(git rev-parse --abbrev-ref HEAD | grep -oP 'ch\K[0-9]')
            cd ci-user && make test CHAPTER=$ID 2>&1 | tee ../output.txt
            cat ../output.txt
            POINTS=$(grep "Test passed" ../output.txt | grep -oP "\d+/\d+" | head -1)
            echo "points=$POINTS"
            if [ -z "$POINTS" ]; then echo "ERROR: No test results found"; exit 1; fi
            GOT="${POINTS%%/*}"
            TOTAL="${POINTS##*/}"
            if [ "$GOT" != "$TOTAL" ]; then
              echo "FAILED: points is not full score: $POINTS"
              exit 1
            fi
            echo "PASSED: full score $POINTS"

        - name: Post score to OpenCamp
          script: |
            ID=$(git rev-parse --abbrev-ref HEAD | grep -oP 'ch\K[0-9]')
            echo "Uploading score for chapter $ID by user $CNB_BUILD_USER"
            curl -X POST "https://api.opencamp.cn/web/api/courseRank/createByThirdToken" \
              -H 'accept: application/json;charset=utf-8' \
              -H 'Content-Type: application/json' \
              -H "token: $RCORE_TOKEN" \
              -d "{\"channel\": \"cnb\", \"courseId\": $RCORE_COURSE_ID, \"ext\": \"{\\\"chapter\\\": \\\"ch${ID}\\\"}\", \"name\": \"$CNB_BUILD_USER\", \"score\": 100, \"totalScore\": 100}" \
              --fail --show-error
